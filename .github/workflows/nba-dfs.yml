name: NBA DraftKings
on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_draftkings.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafttable.csv players.csv
          git diff --cached --quiet || git commit -m "nba slate refresh $(date -u +%F)"
          git push
