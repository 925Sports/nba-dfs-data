                `https://raw.githubusercontent.com/925Sports/prop-data/main/underdog-${sport}.csv`
            ];
            let text = '';
            for (const url of urls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        text = await res.text();
                        if (text && text.length > 20) break;
                    }
                } catch (e) { /* optional overlay */ }
            }
            if (!text) return;
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true }).data || [];
            const { ud } = footballLookups(sport);
            parsed.forEach(r => {
                const name = r['Player Name'] || r.Player || r.Name || r.player || r.description || '';
                const stat = (r['Stat Type'] || r.Stat || r.Market || r.stat || r.title || '').toLowerCase();
                const looksFantasy = !stat || stat.includes('fantasy') || stat.includes('fpts') || stat.includes('pts');
                if (!looksFantasy && stat && !isFantasyStat(stat)) return;
                if (stat && !stat.includes('fantasy') && !stat.includes('fpts') && stat.includes('yard')) return;
                const line = parseLooseLineNumber(
                    r['Underdog Line'] || r.Line || r['Line Score'] || r.point || r.Point || r['Over/Under'] || r.Projection
                );
                const player = normalizeName(name);
                if (player && line != null) ud.set(player, line);
            });
            console.log(`Underdog overlay for ${sport}: ${ud.size} players`);
        }

        function applyFootballFantasyAdjustments(sport) {
            if (sport !== 'nfl' && sport !== 'cfb') return;
            const store = dataStore[sport];
            if (!store || !store.allData) return;
            indexFootballSheetLookups(sport);
            const { rec, ud } = footballLookups(sport);
            store.allData.forEach(row => {
                const player = normalizeName(row['Player Name'] || '');
                if (!player) return;
                const recAvg = rec.get(player);
                if (recAvg != null) row._recTruePoint = recAvg;
                if (!isFantasyStat(row['Stat Type'])) return;
                let rawUd = extractUnderdogValueFromRow(row);
                if (rawUd == null) rawUd = ud.get(player);
                if (rawUd == null) return;
                row._udLineRaw = rawUd;
                row['Underdog Line'] = rawUd;
                const recUsed = recAvg != null ? recAvg : null;
                let recVal = recUsed;
                if (recVal == null) {
                    const pos = (row.Position || row.Pos || '').toUpperCase();
                    recVal = pos.includes('QB') ? 0 : pos.includes('RB') ? 3 : pos.includes('TE') ? 4 : pos.includes('WR') ? 5 : 3;
                }
                const adjusted = rawUd - (0.5 * recVal) + (1.0 * recVal);
                row._udLineAdjusted = adjusted;
                row['Adjusted Underdog Line'] = adjusted;
            });
        }


        function isIntegerLineValue(line) {
            if (line == null || isNaN(line)) return false;
            return Math.abs(line - Math.round(line)) < 1e-8 && line >= 0;
        }

        function isCountStatType(statType) {
            const s = (statType || '').toLowerCase();
            if (!s) return false;
            if (/yard|yds|fantasy|longest|minutes|snap|distance/.test(s)) return false;
            return /td|touchdown|reception|target|catch|sack|int|interception|attempt|completion|carry|rush att|pass att|goal|shot|save|hit|strikeout|steal|block|rebound|assist|three|3-pt|3pt|double|homer|home run|walk|stolen|combo|rbi|run(?!s allowed)|hits|base|pitch/.test(s)
                || /^(pts|points|reb|ast|stl|blk|to|turnovers|k|so|ip|er)$/.test(s.trim());
        }

        function logFact(n) {
            n = Math.round(n);
            if (n < 2) return 0;
            let s = 0;
            for (let i = 2; i <= n; i++) s += Math.log(i);
            return s;
        }

        function poissonPmf(k, lambda) {
            if (lambda <= 0) return k === 0 ? 1 : 0;
            k = Math.round(k);
            if (k < 0) return 0;
            return Math.exp(-lambda + k * Math.log(lambda) - logFact(k));
        }

        function poissonCdf(k, lambda) {
            k = Math.floor(k);
            if (k < 0) return 0;
            let s = 0;
            const cap = Math.min(k, Math.ceil(lambda + 12 * Math.sqrt(Math.max(lambda, 1))));
            for (let i = 0; i <= k; i++) {
                s += poissonPmf(i, lambda);
                if (s >= 0.999999) return 1;
            }
            return Math.min(1, s);
        }

        function poissonPGreaterThan(threshold, lambda) {
            return Math.max(0, 1 - poissonCdf(Math.floor(threshold), lambda));
        }

        function poissonPLessThan(threshold, lambda) {
            return Math.max(0, poissonCdf(Math.floor(threshold) - 1, lambda));
        }

        function fitPoissonLambda(threshold, pOver, seed) {
            const target = Math.min(0.99, Math.max(0.01, pOver));
            let lo = 0.02;
            let hi = Math.max((seed || 1) * 6, (threshold || 1) * 6, 10);
            for (let i = 0; i < 28; i++) {
                const mid = (lo + hi) / 2;
                if (poissonPGreaterThan(threshold, mid) > target) hi = mid;
                else lo = mid;
            }
            return (lo + hi) / 2;
        }

        /**
         * Whole-number PrizePicks lines push at exactly the number.
         * Sheet no-vig % is usually P(X >= L) from the X.5 book line (e.g. 63.6% = 2+ TDs),
         * not P(X > L) which is what "Over 2" actually needs (3+).
         */
        function adjustIntegerLinePushProbabilities(sport) {
            const store = dataStore[sport];
            if (!store || !store.allData) return;
            store.allData.forEach(row => {
                if (row._pushAdjusted) return;
                const line = parseFloat(row['Line Score'] || row.Line);
                if (!isIntegerLineValue(line)) return;
                if (!isCountStatType(row['Stat Type'])) return;

                const rawOver = parseFloat(
                    row['Average No-Vig Over %'] || row['No-Vig Over %'] || row['Max No-Vig %'] || row['Edge %'] || row['% Edge']
                );
                if (!isFinite(rawOver) || rawOver <= 1) return;

                const pListedOver = rawOver > 1.5 ? rawOver / 100 : rawOver;
                if (pListedOver < 0.02 || pListedOver > 0.98) return;

                const avgLine = parseFloat(row['Average Line'] || row['True Point'] || row.Projection);
                const truePt = parseFloat(row['True Point'] || row.Projection || row['Average Line'] || line);
                const marketThreshold = isFinite(avgLine) && avgLine > 0 ? avgLine : Math.max(line - 0.5, 0);
                const seed = isFinite(truePt) && truePt > 0 ? truePt : Math.max(line, 0.8);

                const lambda = fitPoissonLambda(marketThreshold, pListedOver, seed);
                const pOver = poissonPGreaterThan(line, lambda);
                const pUnder = poissonPLessThan(line, lambda);
                const pPush = Math.max(0, 1 - pOver - pUnder);

                if (!isFinite(pOver) || !isFinite(pUnder)) return;

                row._rawNoVigOver = pListedOver * 100;
                row._pushProb = pPush * 100;
                row._trueOverPct = pOver * 100;
                row._trueUnderPct = pUnder * 100;
                row._pushAdjusted = true;

                row['Average No-Vig Over %'] = (pOver * 100).toFixed(2);
                row['Average No-Vig Under %'] = (pUnder * 100).toFixed(2);

                const useOver = pOver >= pUnder;
                const hit = useOver ? pOver : pUnder;
                row['Bet Tag'] = useOver ? 'Over' : 'Under';
                const isFantasy = isFantasyStat(row['Stat Type']);
                if (!isFantasy) {
                    row['Edge %'] = (hit * 100).toFixed(2);
                    row['Max No-Vig %'] = (hit * 100).toFixed(2);
                }
            });
        }

        function prepareSportData(sport) {
            const store = dataStore[sport];
            let data = store.allData || [];
            if (!data.length) return;

            // Merge abbreviated game labels into the full-name version of the same match.
            // "GB @ CHI" and "Green Bay Packers vs Chicago Bears" become one dropdown row
            // that uses the full name (the copy that actually has the data).
            const titlesByMatch = new Map();
            data.forEach(row => {
                const rawGame = (row['Game Short Title'] || row.Game || row.Match || '').trim();
                row._rawGameTitle = rawGame;
                if (rawGame) {
                    const key = gameMatchKey(rawGame, sport);
                    if (!titlesByMatch.has(key)) titlesByMatch.set(key, []);
                    titlesByMatch.get(key).push(rawGame);
                }
                if (row.Team) {
                    row._rawTeam = row.Team;
                    row.Team = expandTeamFullName(row.Team, sport);
                }
                if (row.Opp) {
                    row.Opp = expandTeamFullName(row.Opp, sport);
                }
            });
            const displayByMatch = new Map();
            titlesByMatch.forEach((titles, key) => {
                displayByMatch.set(key, preferredGameLabel(titles, sport));
            });
            data.forEach(row => {
                const rawGame = row._rawGameTitle || '';
                if (!rawGame) return;
                const label = displayByMatch.get(gameMatchKey(rawGame, sport)) || rawGame;
                row['Game Short Title'] = label;
                row.Game = label;
            });

            // Drop exact duplicate player+stat+line+odds rows; keep the richer copy.
            // Distinct lines for the same player+stat (bumped 3.5 -> 4) are ALL kept.
            const seenExact = new Map();
            const deduped = [];
            data.forEach(row => {
                const player = (row['Player Name'] || '').trim();
                const stat = (row['Stat Type'] || '').trim();
                const line = String(row['Line Score'] || row.Line || '').trim();
                const odds = (row['Odds Type'] || 'standard').toString().trim().toLowerCase();
                if (!player || !stat) {
                    deduped.push(row);
                    return;
                }
                const key = `${player}|${stat}|${line}|${odds}`;
                if (!seenExact.has(key)) {
                    seenExact.set(key, deduped.length);
                    deduped.push(row);
                } else {
                    const idx = seenExact.get(key);
                    if (scoreRowCompleteness(row) > scoreRowCompleteness(deduped[idx])) {
                        deduped[idx] = row;
                    }
                }
            });
            store.allData = deduped;
            data = store.allData;
            adjustIntegerLinePushProbabilities(sport);

            // Unique values (canonicalized)
            store.uniqueGames = [...new Set(data.map(r => r['Game Short Title'] || r.Game || '').filter(Boolean))].sort();
            store.uniqueTeams = [...new Set(data.map(r => r.Team || '').filter(Boolean))].sort();
            store.uniqueCallouts = [...new Set(data.map(r => (r['Callout Bet Tag'] || '').trim()).filter(Boolean))].sort();
            if (sport === 'soccer') {
                // Include empty Bet Tag so all soccer props are selectable by default
                store.uniqueBetTags = [...new Set(data.map(r => (r['Bet Tag'] || '').trim()))].sort();
            } else {
                store.uniqueBetTags = [...new Set(data.map(r => (r['Bet Tag'] || '').trim()).filter(Boolean))].sort();
            }

            // Init selections
            store.selectedGames = new Set(store.uniqueGames);
            store.selectedTeams = new Set(store.uniqueTeams);
            store.selectedCallouts = new Set(store.uniqueCallouts);
            store.selectedBetTags = new Set(store.uniqueBetTags);
            store.selectedFav = new Set(['Yes', 'No']);
            store.selectedGameTypes = new Set(['High', 'Normal', 'Low']);
            store.selectedHotCold = new Set(['Hot', 'Cold', 'Neutral']);

            // Soccer: start advanced filters deselected so all props show by default
            if (sport === 'soccer') {
                store.selectedBetTags = new Set();
                store.selectedFav = new Set();
                store.selectedGameTypes = new Set();
            }

            // No heavy game log precomputation on initial load for speed.
            // L5 stats + game logs are now calculated on-demand when user opens a player popup.
            data.forEach(row => {
                row._sport = sport;
            });
            if (sport === 'nfl' || sport === 'cfb') {
                indexFootballSheetLookups(sport);
            }
        }

        // On-demand game log loader (key for fast initial load)
        async function ensureGameLogsLoaded(sport) {
            const store = dataStore[sport];
            if (store.gameLogs && store.gameLogs.length > 0) return; // already loaded

            // NFL / CFB / Soccer: no game log CSVs yet — skip network calls
            if (sport === 'nfl' || sport === 'cfb' || sport === 'soccer' || sport === 'cbb') {
                store.gameLogs = store.gameLogs || [];
                return;
            }

            // NBA prefers the nightly GitHub CSV (includes 2026-27). A local file or the
            // old Sheet (ends June 2026) is only a fallback.
            const sources = sport === 'nba'
                ? [
                    'https://raw.githubusercontent.com/925Sports/nba-dfs-data/main/nba_game_log.csv',
                    './data/nba_game_logs.csv',
                    'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ZvShRlEWJen3PKivCQF79zYZJkW04F00THnwUrD_xUPvq609FWXZaD6sf4SPJ9rBvTzzrusA8a3N/pub?gid=0&single=true&output=csv'
                ]
                : (sport === 'mlb'
                    ? [
                        './data/mlb_game_logs.csv',
                        'https://raw.githubusercontent.com/925Sports/mlb-player-game-logs/refs/heads/main/mlb_2026_season_game_logs.csv'
                    ]
                    : [`./data/${sport}_game_logs.csv`]);

            let gameLogText = '';
            for (const url of sources) {
                try {
                    const day = new Date().toISOString().slice(0, 10);
                    const bust = url.indexOf('nba-dfs-data') !== -1 ? (url + '?v=' + day) : url;
                    const res = await fetch(bust, { cache: 'no-store' });
                    if (!res.ok) continue;
                    const text = await res.text();
                    if (text && text.length > 80 && /PLAYER|fullName|Player Name/i.test(text.slice(0, 800))) {
                        gameLogText = text;
                        break;
                    }
                } catch (e) {
                    console.warn('Game log fetch failed', url, e);
                }
            }

            if (gameLogText) {
                store.gameLogs = Papa.parse(gameLogText, { header: true, skipEmptyLines: true }).data;

                if (sport === 'nba') {
                    // ESPN abbreviations in the CSV don't match the optimizer's team map.
                    const alias = { GS: 'GSW', NY: 'NYK', NO: 'NOP', SA: 'SAS', UTAH: 'UTA', WSH: 'WAS', PHO: 'PHX', CHO: 'CHA', BRK: 'BKN' };
                    const seasonStart = new Date(2026, 9, 1); // Oct 1, 2026
                    let currentSeason = 0;
                    store.gameLogs.forEach(log => {
                        if ((log['3PM'] == null || log['3PM'] === '') && log['3sPM'] != null) log['3PM'] = log['3sPM'];
                        if (log.TEAM) {
                            const up = String(log.TEAM).trim().toUpperCase();
                            log.TEAM = alias[up] || up;
                        }
                        if (log['MATCH UP']) {
                            log['MATCH UP'] = String(log['MATCH UP']).replace(/\b[A-Za-z]{2,4}\b/g, function (m) {
                                const up = m.toUpperCase();
                                return alias[up] || m;
                            });
                        }
                        const d = new Date(log['GAME DATE'] || log.gameDate || '');
                        if (!isNaN(d) && d >= seasonStart) currentSeason++;
                    });
                    console.log('Loaded ' + store.gameLogs.length + ' NBA game logs (' + currentSeason + ' from 2026-27)');
                } else {
                    console.log(`Loaded ${store.gameLogs.length} game logs for ${sport}`);
                }

                // Build fast lookup cache: normalized name -> array of logs
                store.playerLogCache = new Map();
                store.gameLogs.forEach(log => {
                    const rawName = log.PLAYER || log['Player Name'] || log.fullName || log['fullName'] || '';
                    const norm = normalizeName(rawName);
                    if (!norm) return;
                    if (!store.playerLogCache.has(norm)) store.playerLogCache.set(norm, []);
                    store.playerLogCache.get(norm).push(log);
                });
            }
        }

        function initCurrentSport() {
            // Hide advanced filters on "All" tab for better UX (customer-facing)
            const filterBtnEl = document.getElementById('filterBtn');
            const calloutFilterBtnEl = document.getElementById('calloutFilterBtn');
            if (currentSport === 'all') {
                if (filterBtnEl) filterBtnEl.style.display = 'none';
                if (calloutFilterBtnEl) calloutFilterBtnEl.style.display = 'none';
                const advBtn = document.getElementById('advancedFilterBtn');
                if (advBtn) advBtn.style.display = 'none';
                // Build stat type tabs also for All (combined from all sports)
                buildStatTabs();
                renderAllView();

                // Update subtle All-tab info badge in top header (non-disruptive location)
                updateAllTabHeaderInfo();
            } else {
                if (filterBtnEl) filterBtnEl.style.display = '';
                if (calloutFilterBtnEl) calloutFilterBtnEl.style.display = '';
                const advBtn = document.getElementById('advancedFilterBtn');
                if (advBtn) advBtn.style.display = '';
                const store = dataStore[currentSport];
                if (!store || !store.allData.length) {
                    contentDiv.innerHTML = `<div class="empty-state"><h3>No ${currentSport.toUpperCase()} data</h3><p>Check that the CSV is available or refresh the page.</p></div>`;
                    return;
                }

                // When switching to an individual sport tab, reset all filters to "show everything"
                // so the user always sees the full set of props for that sport (unless they explicitly filter).
                if (store.uniqueGames && store.uniqueGames.length) store.selectedGames = new Set(store.uniqueGames);
                if (store.uniqueTeams && store.uniqueTeams.length) store.selectedTeams = new Set(store.uniqueTeams);
                if (store.uniqueCallouts && store.uniqueCallouts.length) store.selectedCallouts = new Set(store.uniqueCallouts);
                if (store.uniqueBetTags && store.uniqueBetTags.length) store.selectedBetTags = new Set(store.uniqueBetTags);
                store.selectedFav = new Set(['Yes', 'No']);
                store.selectedGameTypes = new Set(['High', 'Normal', 'Low']);
                store.selectedHotCold = new Set(['Hot', 'Cold', 'Neutral']);
                store.selectedStatTypes = new Set(); // start with "All" stat types

                // For Soccer tab: start advanced filters (Bet Tag / Fav / O/U) deselected by default.
                // This makes the tab show ALL soccer props initially (matching what user discovered),
                // while still allowing the popup to work when they want to filter.
                if (currentSport === 'soccer') {
                    store.selectedBetTags = new Set();
                    store.selectedFav = new Set();
                    store.selectedGameTypes = new Set();
                }

                // Reset search & view for cleanliness
                searchInput.value = store.searchTerm || '';
                viewSelect.value = store.currentView;
                selectedToggle.checked = store.showSelectedOnly;
                // Sync odds segmented control
                if (oddsSelect) oddsSelect.value = store.currentOddsType || 'standard';
                document.querySelectorAll('#oddsSeg button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.odds === (store.currentOddsType || 'standard'));
                });

                // Rebuild stat type tabs
                buildStatTabs();

                // Render
                renderContent();
            }

            // Always attach listeners (safe to call multiple times)
            attachControlListeners();
        }

        function updateSportTabs() {
            document.querySelectorAll('.sport-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sport === currentSport);
                btn.onclick = () => {
                    const newSport = btn.dataset.sport;
                    if (newSport === currentSport) return;
                    currentSport = newSport;
                    updateSportTabs();
                    initCurrentSport();

                    // Hide advanced filter button on All tab (it only works per-sport)
                    const advBtn = document.getElementById('advancedFilterBtn');
                    if (advBtn) {
                        advBtn.style.display = (currentSport === 'all') ? 'none' : '';
                    }
                };
            });
        }

        // Subtle info badge for All tab - placed in top header so it doesn't disrupt card flow
        function updateAllTabHeaderInfo() {
            const infoEl = document.getElementById('allTabInfo');
            const textEl = document.getElementById('allTabInfoText');
            if (!infoEl || !textEl) return;

            if (currentSport !== 'all') {
                infoEl.style.display = 'none';
                return;
            }

            // Recompute current filtered count (lightweight)
            let allRows = [];
            ['nba', 'wnba', 'mlb', 'nfl', 'cfb', 'soccer', 'cbb'].forEach(s => {
                (dataStore[s].allData || []).forEach(row => {
                    allRows.push({ ...row, _sport: s });
                });
            });

            const selectedOddsType = (document.getElementById('oddsSelect')?.value || 'standard').toLowerCase();
            if (selectedOddsType !== 'all') {
                allRows = allRows.filter(r => {
                    const oddsType = (r['Odds Type'] || 'standard').toLowerCase();
                    return oddsType === selectedOddsType;
                });
            }

            const term = (searchInput.value || '').toLowerCase().trim();
            if (term) {
                allRows = allRows.filter(r =>
                    (r['Player Name'] || '').toLowerCase().includes(term) ||
                    (r['Stat Type'] || '').toLowerCase().includes(term)
                );
            }

            if (window.allStatTypesSelected && window.allStatTypesSelected.size > 0) {
                allRows = allRows.filter(r => window.allStatTypesSelected.has((r['Stat Type'] || '').trim()));
            }

            const count = allRows.length;
            const oddsLabel = selectedOddsType === 'standard' ? 'Standard' : 
                             (selectedOddsType === 'demon' ? 'Demon 👿' : 
                             (selectedOddsType === 'goblin' ? 'Goblin 👺' : 'All'));

            textEl.innerHTML = `<strong>${count}</strong> ${oddsLabel} bets`;
            infoEl.style.display = 'flex';
        }

        function buildStatTabs() {
            tabsDiv.innerHTML = '';

            const isAll = currentSport === 'all';
            let store, data;

            if (isAll) {
                // Combine data from all sports for stat type tabs on "All" view
                data = [];
                ['nba', 'wnba', 'mlb', 'nfl', 'cfb', 'soccer', 'cbb'].forEach(s => {
                    if (dataStore[s] && dataStore[s].allData) {
                        data = data.concat(dataStore[s].allData);
                    }
                });
                if (!window.allStatTypesSelected) window.allStatTypesSelected = new Set();
                store = { selectedStatTypes: window.allStatTypesSelected };
            } else {
                store = dataStore[currentSport];
                data = store.allData || [];
            }

            if (!data.length) return;

            let statTypes = [...new Set(data.map(r => (r['Stat Type'] || '').trim()).filter(Boolean))].sort();

            // Limit to most common for cleanliness (increased to 20 so Outfield Fantasy Score etc. appear on Soccer)
            if (statTypes.length > 50) statTypes = statTypes.slice(0, 50);

            // "All" button clears selection
            const allBtn = document.createElement('div');
            allBtn.className = `tab ${store.selectedStatTypes.size === 0 ? 'active' : ''}`;
            allBtn.textContent = 'All';
            allBtn.onclick = () => {
                store.selectedStatTypes.clear();
                document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
                allBtn.classList.add('active');
                if (isAll) renderAllView(); else renderContent();
            };
            tabsDiv.appendChild(allBtn);

            statTypes.forEach(stat => {
                const btn = document.createElement('div');
                const isActive = store.selectedStatTypes.has(stat);
                btn.className = `tab ${isActive ? 'active' : ''}`;
                btn.textContent = stat;
                btn.onclick = () => {
                    if (store.selectedStatTypes.has(stat)) {
                        store.selectedStatTypes.delete(stat);
                        btn.classList.remove('active');
                    } else {
                        store.selectedStatTypes.add(stat);
                        btn.classList.add('active');
                    }
                    // Deactivate "All" if any specific is selected
                    const allTab = tabsDiv.querySelector('.tab');
                    if (allTab) allTab.classList.remove('active');
                    if (isAll) renderAllView(); else renderContent();
                };
                tabsDiv.appendChild(btn);
            });
        }

        function applyQuickFilter(type) {
            if (currentSport === 'all') return;

            const store = dataStore[currentSport];
            if (!store) return;

            if (type === 'clear') {
                store.selectedStatTypes.clear();
                store.currentOddsType = 'standard';
                searchInput.value = '';
                store.searchTerm = '';
            } else if (type === 'highEdge') {
                // Filter to high edge by temporarily setting a high threshold (we'll filter in render)
                store.tempHighEdgeFilter = true;
            } else if (type === 'demon') {
                store.currentOddsType = 'demon';
            } else if (type === 'goblin') {
                store.currentOddsType = 'goblin';
            }

            renderContent();
        }

        function attachControlListeners() {
            // Search
            searchInput.oninput = () => {
                if (currentSport === 'all') {
                    renderAllView();
                    updateAllTabHeaderInfo();
                } else {
                    dataStore[currentSport].searchTerm = searchInput.value.toLowerCase().trim();
                    renderContent();
                }
            };

            // View select - fully supports Table view on All tab
            viewSelect.onchange = () => {
                if (currentSport === 'all') {
                    renderAllView();
                } else {
                    dataStore[currentSport].currentView = viewSelect.value;
                    renderContent();
                }
            };

            // Selected only
            selectedToggle.onchange = () => {
                if (currentSport === 'all') {
                    renderAllView();
                } else {
                    dataStore[currentSport].showSelectedOnly = selectedToggle.checked;
                    renderContent();
                }
            };

            // Odds type: segmented control + hidden select
            function setOddsType(val) {
                oddsSelect.value = val;
                document.querySelectorAll('#oddsSeg button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.odds === val);
                });
                if (currentSport === 'all') {
                    renderAllView();
                    updateAllTabHeaderInfo();
                    updateStandardBetsCount();
                } else {
                    dataStore[currentSport].currentOddsType = val;
                    renderContent();
                }
            }
            oddsSelect.onchange = () => setOddsType(oddsSelect.value);
            document.querySelectorAll('#oddsSeg button').forEach(btn => {
                btn.onclick = () => setOddsType(btn.dataset.odds);
            });

            // Filter buttons
            document.getElementById('filterBtn').onclick = () => showFilterPopup();
            document.getElementById('calloutFilterBtn').onclick = () => showCalloutFilterPopup();
            document.getElementById('advancedFilterBtn').onclick = () => showAdvancedFilterPopup();
            document.getElementById('betslipBtn').onclick = () => showBetSlipPopup();

            // Clear Bets button (clears persisted selectedBets from localStorage)
            const clearBetsBtn = document.getElementById('clearBetsBtn');
            if (clearBetsBtn) {
                clearBetsBtn.onclick = () => {
                    selectedBets = [];
                    try { localStorage.removeItem('pp_selectedBets'); } catch(e){}
                    updateBetSlipCount();
                    if (currentSport === 'all') {
                        renderAllView();
                    } else {
                        renderContent();
                    }
                    // If bet slip popup is open, refresh it
                    const betSlipPopup = document.getElementById('betslipPopup');
                    if (betSlipPopup && betSlipPopup.style.display === 'block') {
                        renderBetSlipsTable();
                    }
                };
            }

            // Apply buttons for popups (defined in show functions)
        }

        // ==================== RENDER CONTENT ====================
        function renderContent() {
            if (currentSport === 'all') {
                renderAllView();
                return;
            }
            const store = dataStore[currentSport];
            contentDiv.innerHTML = `
                <div style="padding: 20px;">
                    <div class="skeleton skeleton-row" style="width: 100%; margin-bottom: 8px;"></div>
                    <div class="skeleton skeleton-row" style="width: 100%; margin-bottom: 8px;"></div>
                    <div class="skeleton skeleton-row" style="width: 100%; margin-bottom: 8px;"></div>
                    <div class="skeleton skeleton-row" style="width: 100%;"></div>
                </div>
            `;

            setTimeout(async () => {
                // Ensure game logs are loaded for accurate L5/L20 stats in table view
                if (store.currentView === 'table') {
                    await ensureGameLogsLoaded(currentSport);
                }
                let filtered = store.allData.filter(row => (row['Stat Type'] || '').trim() !== '');

                // Multi-select Stat Type filter (case-insensitive + trim for robustness across sports/CSVs)
                if (store.selectedStatTypes.size > 0) {
                    const selectedLower = new Set(Array.from(store.selectedStatTypes).map(s => s.toLowerCase().trim()));
                    filtered = filtered.filter(row => {
                        const rowStat = (row['Stat Type'] || '').trim().toLowerCase();
                        return selectedLower.has(rowStat);
                    });
                }

                // Odds type (case-insensitive)
                if (store.currentOddsType !== 'all') {
                    const want = (store.currentOddsType || 'standard').toLowerCase();
                    filtered = filtered.filter(row => (row['Odds Type'] || 'standard').toLowerCase() === want);
                }

                // Search
                if (store.searchTerm) {
                    const term = store.searchTerm;
                    filtered = filtered.filter(row =>
                        (row['Player Name'] || '').toLowerCase().includes(term) ||
                        (row['Stat Type'] || '').toLowerCase().includes(term) ||
                        (row.Team || '').toLowerCase().includes(term)
                    );
                }

                // Game / Team / Callout filters for Soccer
                // Default behavior: Show ALL soccer props (start with everything visible).
                // Only apply these filters if the user has actively opened a filter popup and deselected items
                // (i.e. the selected set is smaller than the full unique list).
                if (currentSport === 'soccer') {
                    const gamesFull = !store.uniqueGames || store.selectedGames.size >= store.uniqueGames.length;
                    const teamsFull = !store.uniqueTeams || store.selectedTeams.size >= store.uniqueTeams.length;
                    const calloutsFull = !store.uniqueCallouts || store.selectedCallouts.size >= store.uniqueCallouts.length;

                    filtered = filtered.filter(row => {
                        const gameTitle = row['Game Short Title'] || row.Game || '';
                        const gameOk = gamesFull || !gameTitle || store.selectedGames.has(gameTitle);

                        const team = row.Team || '';
                        const teamOk = teamsFull || !team || store.selectedTeams.has(team);

                        const callout = (row['Callout Bet Tag'] || '').trim();
                        const calloutOk = calloutsFull || !callout || store.selectedCallouts.has(callout);

                        return gameOk && teamOk && calloutOk;
                    });
                } else {
                    // Strict when the sport has game/team data; lenient when lists are empty
                    // (NFL/CFB CSVs currently have no Team / Game Short Title columns)
                    const gamesFull = !store.uniqueGames || store.uniqueGames.length === 0 || store.selectedGames.size >= store.uniqueGames.length;
                    const teamsFull = !store.uniqueTeams || store.uniqueTeams.length === 0 || store.selectedTeams.size >= store.uniqueTeams.length;
                    const calloutsFull = !store.uniqueCallouts || store.uniqueCallouts.length === 0 || store.selectedCallouts.size >= store.uniqueCallouts.length;

                    filtered = filtered.filter(row => {
                        const gameTitle = row['Game Short Title'] || row.Game || '';
                        const gameOk = gamesFull || !gameTitle || store.selectedGames.has(gameTitle);

                        const team = row.Team || '';
                        const teamOk = teamsFull || !team || store.selectedTeams.has(team);

                        const callout = (row['Callout Bet Tag'] || '').trim();
                        const calloutOk = calloutsFull || !callout || store.selectedCallouts.has(callout);

                        return gameOk && teamOk && calloutOk;
                    });
                }

                // Advanced filters for Soccer - only apply if user has actively reduced the selection from full set.
                // This ensures Soccer tab starts with ALL props visible, and only filters when user uses the popups.
                if (currentSport === 'soccer') {
                    const betTagsFull = !store.uniqueBetTags || store.selectedBetTags.size >= store.uniqueBetTags.length;
                    const favFull = store.selectedFav.size >= 2; // Yes + No
                    const gameTypesFull = store.selectedGameTypes.size >= 3; // High + Normal + Low

                    if (!betTagsFull && store.selectedBetTags.size > 0) {
                        filtered = filtered.filter(row => {
                            const bt = (row['Bet Tag'] || '').trim();
                            return !bt || store.selectedBetTags.has(bt);
                        });
                    }
                    if (!favFull && store.selectedFav.size > 0) {
                        filtered = filtered.filter(row => store.selectedFav.has(row['Fav'] || 'No'));
                    }
                    if (!gameTypesFull && store.selectedGameTypes.size > 0) {
                        filtered = filtered.filter(row => {
                            const rawOu = row['O/U'] || row['Over/Under'];
                            if (rawOu == null || String(rawOu).trim() === '') return true;
                            const ou = parseFloat(rawOu);
                            if (isNaN(ou) || ou === 0) return true;
                            // Basketball-style buckets only; football totals are much higher and should pass
                            if (ou >= 20) return true;
                            let type = 'Normal';
                            if (ou >= 9.6) type = 'High';
                            else if (ou <= 8.4) type = 'Low';
                            return store.selectedGameTypes.has(type);
                        });
                    }
                } else {
                    // Normal behavior for other sports
                    if (store.selectedBetTags.size > 0) {
                        filtered = filtered.filter(row => {
                            const bt = (row['Bet Tag'] || '').trim();
                            return !bt || store.selectedBetTags.has(bt);
                        });
                    }
                    if (store.selectedFav.size > 0) {
                        filtered = filtered.filter(row => store.selectedFav.has(row['Fav'] || 'No'));
                    }
                    if (store.selectedGameTypes.size > 0) {
                        filtered = filtered.filter(row => {
                            const rawOu = row['O/U'] || row['Over/Under'];
                            if (rawOu == null || String(rawOu).trim() === '') return true;
                            const ou = parseFloat(rawOu);
                            if (isNaN(ou) || ou === 0) return true;
                            // Basketball-style buckets only; football totals are much higher and should pass
                            if (ou >= 20) return true;
                            let type = 'Normal';
                            if (ou >= 9.6) type = 'High';
                            else if (ou <= 8.4) type = 'Low';
                            return store.selectedGameTypes.has(type);
                        });
                    }
                }
                // Hot/Cold filter is not applicable to soccer (no meaningful streak data)
                if (currentSport !== 'soccer' && store.selectedHotCold.size > 0) {
                    filtered = filtered.filter(row => {
                        const status = getHotColdStatus(row['Player Name'], currentSport);
                        return store.selectedHotCold.has(status);
                    });
                }

                if (store.showSelectedOnly) {
                    const selectedKeys = new Set(selectedBets.filter(b => b.sport === currentSport).map(b => b.key));
                    filtered = filtered.filter(row => selectedKeys.has(`${row['Player Name']}-${row['Stat Type']}`));
                }

                // Sort
                filtered.sort((a, b) => {
                    let aVal = parseFloat(a[store.contentSortColumn] || a['Edge %'] || 0);
                    let bVal = parseFloat(b[store.contentSortColumn] || b['Edge %'] || 0);
                    if (store.contentSortColumn === 'Edge') {
                        aVal = parseFloat(a['Edge %'] || 0);
                        bVal = parseFloat(b['Edge %'] || 0);
                    }
                    return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                });

                currentFiltered = filtered;

                contentDiv.innerHTML = '';
                contentDiv.className = store.currentView === 'table' ? 'table-view' : '';

                if (filtered.length === 0) {
                    contentDiv.innerHTML = `<div class="empty-state"><h3>No props match</h3><p>Try a different odds type, clear filters, or switch sports.</p></div>`;
                    return;
                }

                if (store.currentView === 'cards') {
                    filtered.forEach((row, index) => {
                        const card = createPlayerCard(row, index, currentSport);
                        contentDiv.appendChild(card);
                    });
                } else {
                    // Full Table view implementation
                    const table = document.createElement('table');
                    table.style.width = '100%';
                    table.style.borderCollapse = 'collapse';
                    table.style.fontSize = '13px';

                    const thead = document.createElement('thead');
                    const headerRow = document.createElement('tr');
                    const headers = [
                        { label: 'Player', key: null, sortable: false },
                        { label: 'Stat', key: null, sortable: false },
                        { label: 'Edge', key: 'Edge', sortable: true },
                        { label: 'Line', key: 'Line', sortable: true },
                        { label: 'PP vs UD', key: 'PPUD', sortable: true },
                        { label: 'L5 Avg', key: 'L5Avg', sortable: true },
                        { label: 'L5 Hit%', key: 'L5Hit', sortable: true },
                        { label: 'L20 Avg', key: 'L20Avg', sortable: true },
                        { label: 'L20 Hit%', key: 'L20Hit', sortable: true },
                        { label: 'Actions', key: null, sortable: false }
                    ];

                    headers.forEach(h => {
                        const th = document.createElement('th');
                        if (h.label === 'Edge') {
                            th.innerHTML = `Edge <span class="edge-info-icon" style="cursor:pointer; color:#00ffcc; font-size:13px; margin-left:4px;">ℹ️</span>`;
                            th.style.padding = '10px 8px';
                            th.style.background = '#222';
                            th.style.color = '#ccc';
                            th.style.borderBottom = '2px solid #333';
                            th.style.position = 'sticky';
                            th.style.top = '0';

                            setTimeout(() => {
                                const infoIcon = th.querySelector('.edge-info-icon');
                                if (infoIcon) {
                                    infoIcon.onclick = (e) => {
                                        e.stopImmediatePropagation();
                                        showEdgeExplanationModal();
                                    };
                                }
                            }, 0);
                        } else {
                            th.textContent = h.label;
                            th.style.padding = '10px 8px';
                            th.style.background = '#222';
                            th.style.color = '#ccc';
                            th.style.borderBottom = '2px solid #333';
                            th.style.position = 'sticky';
                            th.style.top = '0';
                        }
                        if (h.sortable) {
                            th.style.cursor = 'pointer';
                            th.onclick = () => {
                                if (store.contentSortColumn === h.key) {
                                    store.contentSortDirection = store.contentSortDirection === 'asc' ? 'desc' : 'asc';
                                } else {
                                    store.contentSortColumn = h.key;
                                    store.contentSortDirection = h.key === 'Edge' ? 'desc' : 'asc';
                                }
                                renderContent();
                            };
                            if (store.contentSortColumn === h.key) {
                                th.classList.add(store.contentSortDirection);
                                th.style.color = '#00ffcc';
                            }
                        }
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');

                    // Precompute L5 for table - FAST using cache
                    const storeForCache = dataStore[currentSport];
                    filtered.forEach(row => {
                        const playerName = row['Player Name'];
                        let playerLogs = getPlayerLogs(currentSport, playerName);
                        playerLogs = [...playerLogs].sort((a, b) => new Date(b.gameDate || b['GAME DATE'] || b.date || 0) - new Date(a.gameDate || a['GAME DATE'] || a.date || 0));
                        
                        // FIX for pitcher game logs in table L5/L20: only use actual pitching appearances for pitcher props
                        let calcLogs = playerLogs;
                        if (currentSport === 'mlb') {
                            const statL = (row['Stat Type'] || '').toLowerCase();
                            const isPitcherPropCalc = statL.includes('pitcher') || statL.includes('ip') || statL.includes('earned run') || 
                                                      statL.includes('strikeout') || statL.includes('hits allowed');
                            if (isPitcherPropCalc) {
                                calcLogs = playerLogs.filter(isPitchingAppearance);
                            }
                        }
                        
                        const last5 = calcLogs.slice(0, 5);
                        const line = parseFloat(row['Line Score'] || row.Line || 0);
                        const betTag = (row['Bet Tag'] || '').toLowerCase();
                        const isMore = betTag.includes('more') || betTag.includes('over') || betTag.includes('↑');

                        let l5Avg = '-';
                        let l5Hit = '-';
                        let l20Avg = '-';
                        let l20Hit = '-';

                        if (last5.length > 0) {
                            let sum = 0;
                            let hits = 0;
                            last5.forEach(log => {
                                const val = getStatValue(log, row['Stat Type'] || '', currentSport);
                                sum += val;
                                if (isMore) {
                                    if (val > line) hits++;
                                } else {
                                    if (val < line) hits++;
                                }
                            });
                            l5Avg = (sum / last5.length).toFixed(1);
                            l5Hit = ((hits / last5.length) * 100).toFixed(0);
                        }

                        // L20 calculation
                        const last20 = calcLogs.slice(0, 20);
                        if (last20.length > 0) {
                            let sum20 = 0;
                            let hits20 = 0;
                            last20.forEach(log => {
                                const val = getStatValue(log, row['Stat Type'] || '', currentSport);
                                sum20 += val;
                                if (isMore) {
                                    if (val > line) hits20++;
                                } else {
                                    if (val < line) hits20++;
                                }
                            });
                            l20Avg = (sum20 / last20.length).toFixed(1);
                            l20Hit = ((hits20 / last20.length) * 100).toFixed(0);
                        }

                        row._l5AvgTable = l5Avg;
                        row._l5HitTable = l5Hit;
                        row._l20AvgTable = l20Avg;
                        row._l20HitTable = l20Hit;
                    });

                    // Apply sort if needed
                    let sortedFiltered = [...filtered];
                    if (store.contentSortColumn === 'Edge') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a['Edge %'] || 0);
                            const bVal = parseFloat(b['Edge %'] || 0);
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'Line') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a['Line Score'] || a.Line || 0);
                            const bVal = parseFloat(b['Line Score'] || b.Line || 0);
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'PPUD') {
                        sortedFiltered.sort((a, b) => {
                            const aPP = parseFloat(a['Line Score'] || a.Line || 0);
                            const aUD = getUnderdogLine(a); // respects Fantasy Score <= 0.3 rule + all missing cases
                            const aVal = (aUD === null || aUD === 0) ? 0 : aPP - aUD;

                            const bPP = parseFloat(b['Line Score'] || b.Line || 0);
                            const bUD = getUnderdogLine(b);
                            const bVal = (bUD === null || bUD === 0) ? 0 : bPP - bUD;

                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'L5Avg') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a._l5AvgTable) || 0;
                            const bVal = parseFloat(b._l5AvgTable) || 0;
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'L5Hit') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a._l5HitTable) || 0;
                            const bVal = parseFloat(b._l5HitTable) || 0;
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'L20Avg') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a._l20AvgTable) || 0;
                            const bVal = parseFloat(b._l20AvgTable) || 0;
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    } else if (store.contentSortColumn === 'L20Hit') {
                        sortedFiltered.sort((a, b) => {
                            const aVal = parseFloat(a._l20HitTable) || 0;
                            const bVal = parseFloat(b._l20HitTable) || 0;
                            return store.contentSortDirection === 'asc' ? aVal - bVal : bVal - aVal;
                        });
                    }

                    // FIX #2: Set currentFiltered to the exact sorted order used for the table rows and onclick indices
                    currentFiltered = sortedFiltered;

                    sortedFiltered.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #333';
                        tr.style.cursor = 'pointer';

                        // Player + sport badge
                        const tdPlayer = document.createElement('td');
                        tdPlayer.style.padding = '8px';
                        tdPlayer.innerHTML = `
                            <div class="table-player">
                                <img src="${row['Headshot URL'] || row['Player Image'] || 'https://via.placeholder.com/32?text=?'}" alt="">
                                <div>
                                    <div class="pname">${row['Player Name']}</div>
                                    <div class="pmeta">${row.Team || ''} ${row.Position ? '· ' + row.Position : ''}</div>
                                </div>
                            </div>
                        `;
                        tdPlayer.onclick = () => showPlayerPopup(row, index, currentSport);
                        tr.appendChild(tdPlayer);

                        // Stat
                        const tdStat = document.createElement('td');
                        tdStat.style.padding = '8px';
                        tdStat.textContent = row['Stat Type'] || '';
                        tr.appendChild(tdStat);

                        // Edge
                        const tdEdge = document.createElement('td');
                        const edgeNum = parseFloat(row['Edge %'] || 0);
                        const isHigh = edgeNum >= 54;
                        if (isHigh) tr.classList.add('high-edge-row');
                        const ot = (row['Odds Type'] || '').toLowerCase();
                        const otLabel = ot === 'demon' ? 'Demon' : (ot === 'goblin' ? 'Goblin' : '');
                        tdEdge.innerHTML = `
                            <div class="table-edge">
                                <span class="edge-badge ${isHigh ? 'high' : ''}">${edgeNum.toFixed(1)}%</span>
                                <span class="table-edge-bar"><span style="width:${Math.min(100, Math.max(8, edgeNum))}%"></span></span>
                                ${otLabel ? `<span class="odds-pill ${ot}" style="position:static;font-size:9px;">${otLabel}</span>` : ''}
                            </div>
                        `;
                        tr.appendChild(tdEdge);

                        // Line
                        const tdLine = document.createElement('td');
                        tdLine.style.padding = '8px';
                        tdLine.style.fontWeight = '600';
                        tdLine.textContent = row['Line Score'] || row.Line || '-';
                        tr.appendChild(tdLine);

                        // PP - UD column: Shows PrizePicks line minus Underdog line.
                        // Shows "-" (and gray) when no valid Underdog line exists in data.
                        // Positive = green (PP line > UD line), Negative = red (UD line > PP line).
                        const tdPPUD = document.createElement('td');
                        tdPPUD.style.padding = '8px';
                        tdPPUD.style.fontWeight = '600';
                        const ppLineVal = parseFloat(row['Line Score'] || row.Line || 0);
                        const udLineVal = getUnderdogLine(row);

                        let displayValue;
                        let numericDiff = 0;
                        if (udLineVal === null || udLineVal === undefined) {
                            displayValue = '-';
                            numericDiff = 0;
                        } else {
                            numericDiff = ppLineVal - udLineVal;
                            displayValue = numericDiff.toFixed(1);
                        }

                        tdPPUD.textContent = displayValue;
                        tdPPUD.style.color = numericDiff > 0 ? '#22c55e' : (numericDiff < 0 ? '#ef4444' : '#aaa');
                        tr.appendChild(tdPPUD);

                        // L5 / L20 values - calculate on the fly if pre-computed values are missing (robust for MLB + all sports)
                        let l5Avg = row._l5AvgTable || '-';
                        let l5Hit = row._l5HitTable || '-';
                        let l20Avg = row._l20AvgTable || '-';
                        let l20Hit = row._l20HitTable || '-';

                        if (l5Avg === '-' || l20Avg === '-') {
                            const normPlayer = normalizeName(row['Player Name'] || '');
                            let logs = (dataStore[currentSport]?.gameLogs || []).filter(l => 
                                normalizeName(l.PLAYER || l['Player Name'] || '') === normPlayer
                            ).sort((a, b) => new Date(b['GAME DATE'] || b.gameDate || 0) - new Date(a['GAME DATE'] || a.gameDate || 0));

                            // Apply pitcher filter for L5/L20 recalc if needed
                            if (currentSport === 'mlb') {
                                const statL = (row['Stat Type'] || '').toLowerCase();
                                const isPitcherPropCalc = statL.includes('pitcher') || statL.includes('ip') || statL.includes('earned run') || 
                                                          statL.includes('strikeout') || statL.includes('hits allowed');
                                if (isPitcherPropCalc) {
                                    logs = logs.filter(isPitchingAppearance);
                                }
                            }

                            const line = parseFloat(row['Line Score'] || row.Line || 0);
                            const betTag = (row['Bet Tag'] || '').toLowerCase();
                            const isMore = betTag.includes('more') || betTag.includes('over');

                            const last5 = logs.slice(0, 5);
                            if (last5.length > 0) {
                                let sum = 0, hits = 0;
                                last5.forEach(log => {
                                    const val = getStatValue(log, row['Stat Type'] || '', currentSport);
                                    sum += val;
                                    if (isMore ? val > line : val < line) hits++;
                                });
                                l5Avg = (sum / last5.length).toFixed(1);
                                l5Hit = ((hits / last5.length) * 100).toFixed(0);
                            }

                            const last20 = logs.slice(0, 20);
                            if (last20.length > 0) {
                                let sum = 0, hits = 0;
                                last20.forEach(log => {
                                    const val = getStatValue(log, row['Stat Type'] || '', currentSport);
                                    sum += val;
                                    if (isMore ? val > line : val < line) hits++;
                                });
                                l20Avg = (sum / last20.length).toFixed(1);
                                l20Hit = ((hits / last20.length) * 100).toFixed(0);
                            }
                        }

                        // L5 Avg
                        const tdL5 = document.createElement('td');
                        tdL5.style.padding = '8px';
                        tdL5.textContent = l5Avg;
                        tr.appendChild(tdL5);

                        // L5 Hit%
                        const tdL5Hit = document.createElement('td');
                        tdL5Hit.style.padding = '8px';
                        tdL5Hit.textContent = l5Hit !== '-' ? l5Hit + '%' : '-';
                        tr.appendChild(tdL5Hit);

                        // L20 Avg
                        const tdL20 = document.createElement('td');
                        tdL20.style.padding = '8px';
                        tdL20.textContent = l20Avg;
                        tr.appendChild(tdL20);

                        // L20 Hit%
                        const tdL20Hit = document.createElement('td');
                        tdL20Hit.style.padding = '8px';
                        tdL20Hit.textContent = l20Hit !== '-' ? l20Hit + '%' : '-';
                        tr.appendChild(tdL20Hit);

                        // Actions
                        const tdActions = document.createElement('td');
                        tdActions.style.padding = '8px';
                        const actionsDiv = document.createElement('div');
                        actionsDiv.className = 'buttons';
                        actionsDiv.style.margin = '0';
                        actionsDiv.style.background = 'transparent';

                        const key = `${row['Player Name']}-${row['Stat Type']}`;
                        const selectedBet = selectedBets.find(b => b.key === key && b.sport === currentSport);
                        let lessClass = 'button less';
                        let moreClass = 'button more';
                        if (selectedBet) {
                            if (selectedBet.choice === 'Less') lessClass += ' selected selected-less';
                            else moreClass += ' selected selected-more';
                        } else {
                            const bt = (row['Bet Tag'] || '').toLowerCase();
                            if (bt.includes('over') || bt.includes('more') || bt.includes('↑')) moreClass += ' green-outline';
                            if (bt.includes('under') || bt.includes('less') || bt.includes('↓')) lessClass += ' red-outline';
                        }

                        actionsDiv.innerHTML = `
                            <button class="${lessClass}" data-choice="Less" style="padding:6px 14px;font-size:12px;">↓ Less</button>
                            <button class="${moreClass}" data-choice="More" style="padding:6px 14px;font-size:12px;">↑ More</button>
                        `;

                        const lessBtn = actionsDiv.querySelector('.button.less');
                        const moreBtn = actionsDiv.querySelector('.button.more');

                        lessBtn.onclick = (e) => {
                            e.stopImmediatePropagation();
                            toggleBet(row, 'Less', currentSport);
                        };
                        moreBtn.onclick = (e) => {
                            e.stopImmediatePropagation();
                            toggleBet(row, 'More', currentSport);
                        };

                        tdActions.appendChild(actionsDiv);
                        tr.appendChild(tdActions);

                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);
                    contentDiv.appendChild(table);
                }
            }, 50);
        }

        function createPlayerCard(row, index, sport) {
            const card = document.createElement('div');
            card.className = 'card';

            const edge = parseFloat(row['Edge %'] || 0).toFixed(1) + '%';
            const lineVal = row['Line Score'] || row.Line || '-';
            const statType = row['Stat Type'] || '';
            const playerName = row['Player Name'] || '';
            const team = row.Team || '';
            const gameTitle = row['Game Short Title'] || (row.Opp ? `@ ${row.Opp}` : '');
            const betTag = (row['Bet Tag'] || '').trim();
            const oddsType = (row['Odds Type'] || 'standard').toLowerCase();

            let iconHTML = '';
            if (oddsType === 'demon') iconHTML = '<div class="icon">👿</div>';
            if (oddsType === 'goblin') iconHTML = '<div class="icon">👺</div>';

            let headshotRingClass = '';
            if (sport === 'nba') headshotRingClass = 'nba';
            else if (sport === 'wnba') headshotRingClass = 'wnba';
            else if (sport === 'mlb') headshotRingClass = 'mlb';
            else if (sport === 'nfl') headshotRingClass = 'nfl';
            else if (sport === 'cfb') headshotRingClass = 'cfb';
            else if (sport === 'soccer') headshotRingClass = 'soccer';
            else if (sport === 'cbb') headshotRingClass = 'cbb';

            const key = `${playerName}-${statType}`;
            const selected = selectedBets.find(b => b.key === key && b.sport === sport);
            let lessClass = 'button less';
            let moreClass = 'button more';
            if (selected) {
                if (selected.choice === 'Less') lessClass += ' selected selected-less';
                else moreClass += ' selected selected-more';
            }

            const betTagLower = betTag.toLowerCase();
            const dividerClass = betTagLower.includes('more') || betTagLower.includes('over') ? 'more' : (betTagLower.includes('less') || betTagLower.includes('under') ? 'less' : '');

            const edgeNum = parseFloat(row['Edge %'] || 0);
            const isHigh = edgeNum >= 54;
            if (isHigh) card.classList.add('high-edge');
            const edgeBarWidth = Math.min(100, Math.max(8, edgeNum));
            const oddsLabel = oddsType === 'demon' ? 'Demon' : (oddsType === 'goblin' ? 'Goblin' : 'Standard');

            card.innerHTML = `
                <div class="odds-pill ${oddsType}">${oddsLabel}</div>
                <div class="header" style="justify-content:center;">
                    <span class="edge-badge ${isHigh ? 'high' : ''}">${edge}</span>
                </div>
                <div class="edge-bar"><span style="width:${edgeBarWidth}%"></span></div>
                <div class="headshot-wrapper ${headshotRingClass}">
                    <img class="headshot" src="${row['Headshot URL'] || row['Player Image'] || 'https://via.placeholder.com/78?text=?'}" alt="${playerName}">
                </div>
                <div class="name">${playerName}</div>
                <div class="team">${team}${gameTitle ? ' · ' + gameTitle : ''}</div>
                <div class="stat">${lineVal} ${statType}</div>
                ${(isFantasyStat(statType) && (sport === 'nfl' || sport === 'cfb') && getUnderdogLine(row) != null) ? `<div style="font-size:11px;color:#9ca3af;margin-top:2px;">UD ${Number(row._udLineRaw != null ? row._udLineRaw : getRawUnderdogLine(row)).toFixed(2)} → PP ${Number(getUnderdogLine(row)).toFixed(1)}</div>` : ''}
                <div class="buttons">
                    <button class="${lessClass}" data-choice="Less">↓ Less</button>
                    <div class="divider ${dividerClass}"></div>
                    <button class="${moreClass}" data-choice="More">↑ More</button>
                </div>
                <div class="info-icon" title="Player Info">ℹ️</div>
            `;

            // Button handlers
            const lessBtn = card.querySelector('.button.less');
            const moreBtn = card.querySelector('.button.more');
            const infoIcon = card.querySelector('.info-icon');

            lessBtn.onclick = (e) => {
                e.stopImmediatePropagation();
                toggleBet(row, 'Less', sport, card);
            };
            moreBtn.onclick = (e) => {
                e.stopImmediatePropagation();
                toggleBet(row, 'More', sport, card);
            };
            infoIcon.onclick = (e) => {
                e.stopImmediatePropagation();
                showPlayerPopup(row, index, sport);
            };

            return card;
        }

        function toggleBet(row, choice, sport, cardElement = null) {
            const playerName = row['Player Name'];
            const statType = row['Stat Type'];
            const key = `${playerName}-${statType}`;
            const existingIndex = selectedBets.findIndex(b => b.key === key && b.sport === sport);

            // Safer edge/prob calculation + robust ID fallbacks (helps soccer + any CSV with different headers)
            let edgeVal = parseFloat(row['Edge %'] || row.Edge || row['edge'] || 50);
            if (isNaN(edgeVal) || edgeVal <= 0) edgeVal = 50;
            const safeProb = Math.min(Math.max(edgeVal / 100, 0.01), 0.99);

            const betData = {
                key,
                player: playerName,
                choice,
                line: row['Line Score'] || row.Line,
                stat: statType,
                edge: edgeVal,
                prob: safeProb,
                game: row['Game Short Title'] || row.Game || row.Match || row.Fixture || 'Mixed',
                team: row.Team,
                sport: sport,
                id: row.id || row.ID || row['Data ID'] || row['Player ID'] || '',
                projectionId: row['Data ID'] || row['Projection ID'] || row.id || row.ID || ''
            };

            if (existingIndex > -1) {
                if (selectedBets[existingIndex].choice === choice) {
                    selectedBets.splice(existingIndex, 1);
                } else {
                    selectedBets[existingIndex] = betData;
                }
            } else {
                selectedBets.push(betData);
            }

            try { localStorage.setItem('pp_selectedBets', JSON.stringify(selectedBets)); } catch(e){}

            updateBetSlipCount();

            // Re-render current view to update button states
            if (currentSport === 'all') {
                renderAllView();
            } else {
                renderContent();
            }
        }

        function updateBetSlipCount() {
            const btn = document.getElementById('betslipBtn');
            if (btn) btn.innerHTML = `Bet Slips (${selectedBets.length})`;
        }

        function updateStandardBetsCount() {
            const el = document.getElementById('standardBetsNumber');
            if (!el) return;

            let count = 0;
            ['nba', 'wnba', 'mlb', 'nfl', 'cfb', 'soccer', 'cbb'].forEach(sport => {
                const data = dataStore[sport]?.allData || [];
                count += data.filter(row => (row['Odds Type'] || 'standard').toLowerCase() === 'standard').length;
            });

            el.textContent = count;
        }

        // ==================== ALL VIEW ====================
        function renderAllView() {
            contentDiv.innerHTML = '';
            contentDiv.className = '';
            contentDiv.style.cssText = 'max-width: 1400px; margin: 0 auto; padding: 0 24px;';

            let allRows = [];
            ['nba', 'wnba', 'mlb', 'nfl', 'cfb', 'soccer', 'cbb'].forEach(s => {
                (dataStore[s].allData || []).forEach(row => {
                    allRows.push({ ...row, _sport: s });
                });
            });

            // Filter by selected Odds Type (Standard / Demon / Goblin)
            const selectedOddsType = (document.getElementById('oddsSelect')?.value || 'standard').toLowerCase();
            if (selectedOddsType !== 'all') {
                allRows = allRows.filter(r => {
                    const oddsType = (r['Odds Type'] || 'standard').toLowerCase();
                    return oddsType === selectedOddsType;
                });
            }

            // Simple global search
            const term = (searchInput.value || '').toLowerCase().trim();
            if (term) {
                allRows = allRows.filter(r =>
                    (r['Player Name'] || '').toLowerCase().includes(term) ||
                    (r['Stat Type'] || '').toLowerCase().includes(term)
                );
            }

            // Respect Stat Type tabs selection on "All" view (if user clicked any specific stat pills)
            if (window.allStatTypesSelected && window.allStatTypesSelected.size > 0) {
                allRows = allRows.filter(r => window.allStatTypesSelected.has((r['Stat Type'] || '').trim()));
            }

            // Selected Only filter (works on All tab)
            if (selectedToggle && selectedToggle.checked) {
                const selectedKeys = new Set(selectedBets.map(b => b.key));
                allRows = allRows.filter(row => 
                    selectedKeys.has(`${row['Player Name']}-${row['Stat Type']}`)
                );
            }

            // Sort by edge desc by default
            allRows.sort((a, b) => (parseFloat(b['Edge %'] || 0) - parseFloat(a['Edge %'] || 0)));

            if (allRows.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No bets available across sports for current filters.</div>';
                updateStandardBetsCount();
                return;
            }

            // Determine view mode for All tab
            const isTableView = (document.getElementById('viewSelect')?.value === 'table');

            if (isTableView) {
                // Load game logs in background for better L5/L20 data (non-blocking)
                // We render the table immediately and show "-" where logs aren't available yet
                Promise.allSettled([
                    ensureGameLogsLoaded('nba'),
                    ensureGameLogsLoaded('wnba'),
                    ensureGameLogsLoaded('mlb')
                ]).then(() => {
                    // Optional: re-render once in background if user is still on All+Table
                    // (helps if logs finish after first paint)
                    if (currentSport === 'all' && document.getElementById('viewSelect')?.value === 'table') {
                        // Only refresh if still in this exact state
                        setTimeout(() => {
                            if (currentSport === 'all' && document.getElementById('viewSelect')?.value === 'table') {
                                renderAllView();
                            }
                        }, 800);
                    }
                });

                // Render Table View for All tab immediately (don't block on logs)
                contentDiv.classList.add('table-view');
                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const headers = ['Sport', 'Player', 'Stat', 'Line', 'Edge', 'PP vs UD', 'L5 Avg', 'L5 Hit%', 'L20 Avg', 'L20 Hit%', 'Actions'];
                const headerRow = document.createElement('tr');
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                // Cap the unfiltered All tab for first paint. Once the user searches a
                // player or narrows by stat, render every matching standard/normal line.
                const allViewNarrowed = !!(term || (selectedToggle && selectedToggle.checked) || (window.allStatTypesSelected && window.allStatTypesSelected.size > 0));
                const rowsToPaint = allViewNarrowed ? allRows : allRows.slice(0, 300);
                currentFiltered = rowsToPaint;
                rowsToPaint.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    const sportLabel = (row._sport || '').toUpperCase();

                    // Sport
                    const tdSport = document.createElement('td');
                    tdSport.textContent = sportLabel;
                    tdSport.setAttribute('data-label', 'Sport');
                    tr.appendChild(tdSport);

                    // Player + click to popup
                    const tdPlayer = document.createElement('td');
                    tdPlayer.innerHTML = `<div class="table-player"><div><div class="pname" style="cursor:pointer;">${row['Player Name']}</div><div class="pmeta">${row.Team || ''}</div></div></div>`;
                    tdPlayer.setAttribute('data-label', 'Player');
                    tdPlayer.onclick = () => showPlayerPopup(row, idx, row._sport);
                    tr.appendChild(tdPlayer);

                    // Stat
                    const tdStat = document.createElement('td');
                    tdStat.textContent = row['Stat Type'];
                    tdStat.setAttribute('data-label', 'Stat');
                    tr.appendChild(tdStat);

                    // Line
                    const tdLine = document.createElement('td');
                    tdLine.textContent = row['Line Score'] || '-';
                    tdLine.setAttribute('data-label', 'Line');
                    tr.appendChild(tdLine);

                    // Edge
                    const tdEdge = document.createElement('td');
                    const edgeVal = parseFloat(row['Edge %']) || 0;

            // === Refined Mobile Gestures (Easy + Professional) ===

            // Swipe down → Close bottom sheet

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                let lastTap = 0;
                let touchStartY = 0;
                let popupTouchStartX = 0;  // declared early to avoid TDZ/reference issues in swipe handler

                // Store touch start X for horizontal swipe (must be before touchend listener)
                popup.addEventListener('touchstart', function(e) {
                    popupTouchStartX = e.changedTouches[0].screenX;
                    touchStartY = e.changedTouches[0].screenY;  // also capture here for consistency
                }, { passive: true });

                // Double-tap detection (only on header + main content, not deep scroll areas)
                const doubleTapAreas = [popup.querySelector('.header'), popup.querySelector('#popupContent')].filter(Boolean);

                doubleTapAreas.forEach(area => {
                    area.addEventListener('touchend', function(e) {

                        const tapLength = currentTime - lastTap;

                        if (tapLength < 320 && tapLength > 0) {
                            e.preventDefault();

                            const currentRow = currentFiltered[currentRowIndex];
                            if (!currentRow) return;

                            const betTag = (currentRow['Bet Tag'] || '').toLowerCase();
                            const choice = (betTag.includes('more') || betTag.includes('over') || betTag.includes('↑')) ? 'More' : 'Less';
